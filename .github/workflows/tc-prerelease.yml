name: Build TC Pre-Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TC Pre-Release on Windows
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout Dalamud
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.0.2

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.200'

      - name: Determine pre-release version tag
        id: version
        shell: pwsh
        run: |
          # Read base version from Dalamud.csproj
          [xml]$csproj = Get-Content "Dalamud/Dalamud.csproj"
          $baseVer = ($csproj.Project.PropertyGroup | Where-Object { $_.DalamudVersion } | Select-Object -First 1).DalamudVersion

          # Find highest pre-release build number for current baseVer from git tags
          $tags = git tag -l "$baseVer-tc-pre.*"
          $maxBuild = 0
          foreach ($t in $tags) {
            if ($t -match '-tc-pre\.(\d+)$') {
              $num = [int]$Matches[1]
              if ($num -gt $maxBuild) { $maxBuild = $num }
            }
          }
          $nextBuild = $maxBuild + 1
          $tag = "$baseVer-tc-pre.$nextBuild"

          "DALAMUD_VERSION=$baseVer"   >> $env:GITHUB_OUTPUT
          "RELEASE_TAG=$tag"           >> $env:GITHUB_OUTPUT
          "NEXT_BUILD=$nextBuild"      >> $env:GITHUB_OUTPUT
          Write-Host "Base version: $baseVer  Pre-release tag: $tag"

      - name: Define VERSION file
        run: |
          $env:COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          $env:REPO_NAME = $env:GITHUB_REPOSITORY -replace '.*/'
          $env:BRANCH = $env:GITHUB_REF -replace '.*/'
          ($env:REPO_NAME) >> VERSION
          ($env:BRANCH) >> VERSION
          ($env:COMMIT) >> VERSION

      - name: Build and Test Dalamud
        run: .\build.ps1 ci

      - name: Package release artifact
        id: package
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.RELEASE_TAG }}"
          $zip = "dalamud-tc-$tag.zip"
          Compress-Archive -Path bin\Release\* -DestinationPath $zip
          "ZIP_NAME=$zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.RELEASE_TAG }}
          name: "Dalamud TC Edition ${{ steps.version.outputs.RELEASE_TAG }}"
          prerelease: true
          files: ${{ steps.package.outputs.ZIP_NAME }}
          body: |
            ## Dalamud TC Edition — Pre-Release (Testing Build)

            > ⚠️ **Pre-release — 僅供測試，請勿用於正式環境**

            Base version: `${{ steps.version.outputs.DALAMUD_VERSION }}` (API 13)
            Current stable build: `#${{ steps.version.outputs.CURRENT_BUILD }}`
            This pre-release build: `#${{ steps.version.outputs.NEXT_BUILD }}`

            此版本為下一個正式 build 的測試版，若測試通過，執行 **Build and Release TC Edition** 即可發布對應的正式版。
